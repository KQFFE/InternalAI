# .github/workflows/azure-deployment.yml
# Complete CI/CD pipeline for InternalAI React + Flask app deployment to Azure

name: Build and Deploy InternalAI to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: qss-ai-webapp
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # ================================
    # STEP 1: CHECKOUT CODE
    # ================================
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    # ================================
    # STEP 2: SETUP NODE.JS FOR REACT
    # ================================
    - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    # ================================
    # STEP 3: INSTALL FRONTEND DEPS
    # ================================
    - name: 📦 Install frontend dependencies
      working-directory: ./frontend
      run: |
        echo "Installing React dependencies..."
        npm ci --production=false
        echo "✅ Frontend dependencies installed"
    
    # ================================
    # STEP 4: BUILD REACT APPLICATION
    # ================================
    - name: 🏗️ Build React application
      working-directory: ./frontend
      run: |
        echo "Building React application..."
        npm run build
        echo "✅ React build completed"
        ls -la build/
    
    # ================================
    # STEP 5: SETUP PYTHON FOR FLASK
    # ================================
    - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    # ================================
    # STEP 6: INSTALL PYTHON DEPS
    # ================================
    - name: 📦 Install Python dependencies
      run: |
        echo "Upgrading pip..."
        python -m pip install --upgrade pip
        echo "Installing Python dependencies..."
        pip install -r backend/requirements.txt
        echo "✅ Python dependencies installed"
    
    # ================================
    # STEP 7: INTEGRATE REACT WITH FLASK
    # ================================
    - name: 🔧 Integrate React build with Flask
      run: |
        echo "Creating Flask template and static directories..."
        mkdir -p templates static
        
        echo "Copying React build to Flask structure..."
        
        # Copy index.html to templates (Flask will serve this)
        cp frontend/build/index.html templates/
        echo "✅ Copied index.html to templates/"
        
        # Copy all static assets
        if [ -d "frontend/build/static" ]; then
          cp -r frontend/build/static/* static/
          echo "✅ Copied static assets to static/"
        fi
        
        # Copy other build files (favicon, manifest, etc.)
        find frontend/build -maxdepth 1 -type f -name "*.ico" -o -name "*.json" -o -name "*.txt" -o -name "*.png" -o -name "*.jpg" -o -name "*.svg" | while read file; do
          cp "$file" static/
          echo "✅ Copied $(basename "$file") to static/"
        done
        
        # Copy team photos from public/img to static/img
        if [ -d "frontend/public/img" ]; then
          mkdir -p static/img
          cp -r frontend/public/img/* static/img/
          echo "✅ Copied team photos to static/img/"
        else
          echo "⚠️ No team photos found in frontend/public/img/"
        fi
        
        echo "Final structure:"
        ls -la templates/
        ls -la static/
    
    # ================================
    # STEP 8: PREPARE DEPLOYMENT PACKAGE
    # ================================
    - name: 📦 Create deployment package
      run: |
        echo "Creating deployment package..."
        mkdir -p deployment
    
        # Copy Flask app files
        cp backend/app.py deployment/
        cp backend/requirements.txt deployment/
    
        # Copy ONLY web.config (no startup.sh to avoid conflicts)
        if [ -f "web.config" ]; then
          cp web.config deployment/
          echo "✅ Copied hybrid web.config (React Router + static files only)"
        fi

        # Skip startup.sh to avoid Oryx build conflicts
        echo "🚫 Skipping startup.sh - using Azure startup command for app execution"

        # Create dummy startup.sh to satisfy Azure Oryx build system
        cat > deployment/startup.sh << 'EOF'
        #!/bin/bash
        # Dummy startup.sh file to satisfy Azure Oryx build system
        # This file exists only to prevent build errors
        # Actual app startup is handled by Azure startup command
        echo "Dummy startup.sh executed - Azure startup command will handle actual startup"
        exit 0
        EOF
        chmod +x deployment/startup.sh
        echo "✅ Created dummy startup.sh to satisfy Azure build system"

    
        # Copy templates and static
        cp -r templates deployment/
        cp -r static deployment/
    
        # Copy any other necessary files
        if [ -f "team.json" ]; then
          cp team.json deployment/
          echo "✅ Copied team.json to deployment/static/"
        fi
    
        echo "Deployment package contents:"
        find deployment -type f | head -20
        echo "✅ Deployment package ready"
    
# ================================
    # STEP 9: DEPLOY TO AZURE (MAIN BRANCH ONLY)
    # ================================
    - name: 🔐 Azure Login
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: 🚀 Deploy to Azure App Service
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: './deployment'

    # ================================
    # STEP 10: DEPLOYMENT SUMMARY
    # ================================
    - name: 📊 Deployment Summary
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🌐 Your app should be available at: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        echo "📋 Deployment Details:"
        echo "   - Python Version: ${{ env.PYTHON_VERSION }}"
        echo "   - Node.js Version: ${{ env.NODE_VERSION }}"
        echo "   - Branch: ${{ github.ref }}"
        echo "   - Commit: ${{ github.sha }}"