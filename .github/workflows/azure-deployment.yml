# .github/workflows/azure-deployment.yml
# CI/CD pipeline for InternalAI React + Flask app - Container-based deployment

name: Build and Deploy InternalAI to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: qss-ai-webapp
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ================================
  # JOB 1: TEST AND QUALITY CHECKS
  # ================================
  test-and-quality:
    runs-on: ubuntu-latest

    steps:
    # ================================
    # CHECKOUT CODE
    # ================================
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    # ================================
    # SETUP NODE.JS FOR FRONTEND
    # ================================
    - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # ================================
    # INSTALL FRONTEND DEPENDENCIES
    # ================================
    - name: 📦 Install frontend dependencies
      working-directory: ./frontend
      run: |
        echo "Installing React dependencies..."
        npm ci --production=false
        echo "✅ Frontend dependencies installed"

    # ================================
    # FRONTEND TESTS AND ANALYSIS
    # ================================
    - name: 🔍 Run ESLint (JavaScript)
      working-directory: ./frontend
      run: |
        npx eslint src/ --format=compact --max-warnings=0
      continue-on-error: false

    - name: 📊 Run Frontend Tests with Coverage
      working-directory: ./frontend
      run: |
        npm test -- --coverage --watchAll=false
      continue-on-error: false

    - name: 📤 Upload Frontend Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend

    # ================================
    # SETUP PYTHON FOR BACKEND
    # ================================
    - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    # ================================
    # INSTALL PYTHON DEPENDENCIES
    # ================================
    - name: 📦 Install Python dependencies
      run: |
        echo "Upgrading pip..."
        python -m pip install --upgrade pip
        echo "Installing Python dependencies..."
        pip install -r backend/requirements.txt
        echo "✅ Python dependencies installed"

    # ================================
    # BACKEND TESTS AND ANALYSIS
    # ================================
    - name: 📊 Run Backend Tests with Coverage
      run: |
        pip install pytest pytest-cov
        pytest backend/ --cov=backend --cov-report=xml
      continue-on-error: false

    - name: 📤 Upload Backend Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: backend

    # ================================
    # SECURITY SCANNING
    # ================================
    - name: 🛡️ Run Bandit (Python Security)
      run: |
        pip install bandit
        bandit -r backend/ -f json -o bandit-report.json || true
        echo "✅ Security scan completed"

    - name: 🔍 Generate ESLint SARIF
      working-directory: ./frontend
      run: |
        npm install @microsoft/eslint-formatter-sarif --save-dev
        npx eslint src/ --format @microsoft/eslint-formatter-sarif --output-file eslint-report.sarif || true
      continue-on-error: true

    - name: 📤 Upload ESLint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: eslint-security-report
        path: frontend/eslint-report.sarif

    - name: 📊 Upload Bandit Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

  # ================================
  # JOB 2: BUILD AND DEPLOY
  # ================================
  build-and-deploy:
    needs: test-and-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    # ================================
    # CHECKOUT CODE
    # ================================
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    # ================================
    # SETUP NODE.JS FOR FRONTEND BUILD
    # ================================
    - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # ================================
    # BUILD FRONTEND
    # ================================
    - name: 📦 Install frontend dependencies
      working-directory: ./frontend
      run: |
        echo "Installing React dependencies..."
        npm ci --production=false
        echo "✅ Frontend dependencies installed"

    - name: 🏗️ Build React application
      working-directory: ./frontend
      run: |
        echo "Building React application..."
        npm run build
        echo "✅ React build completed"
        ls -la build/

    # ================================
    # INTEGRATE FRONTEND WITH FLASK
    # ================================
    - name: 🔧 Integrate React build with Flask
      run: |
        echo "Creating Flask template and static directories..."
        mkdir -p templates static

        echo "Copying React build to Flask structure..."

        # Copy index.html to templates (Flask serves this as main template)
        cp frontend/build/index.html templates/
        echo "✅ Copied index.html to templates/"

        # Copy static JS/CSS bundles to static folder
        if [ -d "frontend/build/static" ]; then
          cp -r frontend/build/static/* static/
          echo "✅ Copied JS/CSS bundles to static/"
        fi

        # Copy root-level files (favicon, manifest, etc.) to static folder
        find frontend/build -maxdepth 1 -type f \( -name "*.ico" -o -name "*.json" -o -name "*.txt" -o -name "*.png" -o -name "*.jpg" -o -name "*.svg" \) -exec cp {} static/ \;
        echo "✅ Copied root-level files to static/"

        # Copy static/img folder (team photos) to static
        if [ -d "frontend/build/static/img" ]; then
          cp -r frontend/build/static/img static/
          echo "✅ Copied static/img folder to static/"
        fi

        echo "Final structure:"
        ls -la templates/
        ls -la static/

    # ================================
    # CONTAINER BUILD AND DEPLOYMENT
    # ================================
    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔑 Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: rginternalai.azurecr.io
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    - name: 🏗️ Build and push container image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          rginternalai.azurecr.io/internalai:latest
          rginternalai.azurecr.io/internalai:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🚀 Deploy container to Azure App Service
      run: |
        echo "🚀 Deploying container to Azure App Service..."

        # Configure App Service to use container
        az webapp config container set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group rg-internalai-prod \
          --docker-custom-image-name rginternalai.azurecr.io/internalai:latest \
          --docker-registry-server-url https://rginternalai.azurecr.io

        # Set environment variables for database
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group rg-internalai-prod \
          --settings \
            DATABASE_URL="${{ secrets.DATABASE_CONNECTION_STRING }}" \
            FLASK_ENV=production

        # Set startup command to run migrations before starting app
        echo "🔧 Configuring startup command with migrations..."
        az webapp config set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group rg-internalai-prod \
          --startup-file 'python -m flask db upgrade && python -m gunicorn --bind 0.0.0.0:8000 --workers 1 --timeout 600 --log-level debug --pythonpath /home/site/wwwroot run:app'

        echo "⏳ Waiting for container deployment..."
        sleep 60

        echo "🔄 Restarting app service..."
        az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group rg-internalai-prod

        echo "✅ Container deployment completed"

    # ================================
    # VERIFY DEPLOYMENT
    # ================================
    - name: 🔍 Verify deployment and check logs
      run: |
        echo "⏳ Waiting for app service to restart..."
        sleep 45

        echo "🌐 App should be available at: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

    # ================================
    # DEPLOYMENT SUMMARY
    # ================================
    - name: 📊 Deployment Summary
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🌐 Your app should be available at: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        echo "📋 Deployment Details:"
        echo "   - Python Version: ${{ env.PYTHON_VERSION }}"
        echo "   - Node.js Version: ${{ env.NODE_VERSION }}"
        echo "   - Branch: ${{ github.ref }}"
        echo "   - Commit: ${{ github.sha }}"
