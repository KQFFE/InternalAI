# .github/workflows/azure-deployment.yml
# Complete CI/CD pipeline for InternalAI React + Flask app deployment to Azure

name: Build and Deploy InternalAI to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: qss-ai-webapp
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # ================================
    # STEP 1: CHECKOUT CODE
    # ================================
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    # ================================
    # STEP 2: SETUP NODE.JS FOR REACT
    # ================================
    - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    # ================================
    # STEP 3: INSTALL FRONTEND DEPS
    # ================================
    - name: 📦 Install frontend dependencies
      working-directory: ./frontend
      run: |
        echo "Installing React dependencies..."
        npm ci --production=false
        echo "✅ Frontend dependencies installed"
    
    # ================================
    # NEW STEP 4: FRONTEND CODE ANALYSIS  
    # ================================
    - name: 🔍 Run ESLint (JavaScript)
      working-directory: ./frontend
      run: |
        npx eslint src/ --format=compact --max-warnings=0
      continue-on-error: false

    # ================================
    # NEW STEP 5: FRONTEND CODE COVERAGE
    # ================================
    - name: 📊 Run Frontend Tests with Coverage
      working-directory: ./frontend
      run: |
        npm test -- --coverage --watchAll=false
      continue-on-error: false

    - name: 📤 Upload Frontend Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend

    # ================================
    # STEP 6: BUILD REACT APPLICATION
    # ================================
    - name: 🏗️ Build React application
      working-directory: ./frontend
      run: |
        echo "Building React application..."
        npm run build
        echo "✅ React build completed"
        ls -la build/
    
    # ================================
    # STEP 7: SETUP PYTHON FOR FLASK
    # ================================
    - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    # ================================
    # STEP 8: INSTALL PYTHON DEPS
    # ================================
    - name: 📦 Install Python dependencies
      run: |
        echo "Upgrading pip..."
        python -m pip install --upgrade pip
        echo "Installing Python dependencies..."
        pip install -r backend/requirements.txt
        echo "✅ Python dependencies installed"

    # ================================
    # NEW STEP 9: BACKEND CODE COVERAGE  
    # ================================
    - name: 📊 Run Backend Tests with Coverage
      run: |
        pip install pytest pytest-cov
        pytest backend/ --cov=backend --cov-report=xml
      continue-on-error: false

    - name: 📤 Upload Backend Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: backend
    
    # ================================
    # NEW STEP 10: BACKEND SECURITY ANALYSIS
    # ================================
    - name: 🛡️ Run Bandit (Python Security)
      run: |
        pip install bandit
        bandit -r backend/ -f json -o bandit-report.json || true
        echo "✅ Security scan completed"

    # ================================
    # STEP 11: GENERATE SARIF REPORTS
    # ================================
    - name: 🔍 Generate ESLint SARIF
      working-directory: ./frontend
      run: |
        npm install @microsoft/eslint-formatter-sarif --save-dev
        npx eslint src/ --format @microsoft/eslint-formatter-sarif --output-file eslint-report.sarif || true
      continue-on-error: true

    - name: 📤 Upload ESLint results  
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: eslint-security-report
        path: frontend/eslint-report.sarif

    - name: 📊 Upload Bandit Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

    # ================================
    # STEP 12: INTEGRATE REACT WITH FLASK
    # ================================
    - name: 🔧 Integrate React build with Flask
      run: |
        echo "Creating Flask template and static directories..."
        mkdir -p templates static

        echo "Copying React build to Flask structure..."

        # Copy ALL build files to templates (Flask serves everything from there)
        cp -r frontend/build/* templates/
        echo "✅ Copied all build files to templates/"

        # Also copy static folder to root level (in case Flask looks there too)
        if [ -d "frontend/build/static" ]; then
          cp -r frontend/build/static/* static/
          echo "✅ Copied static assets to static/"
        fi

        echo "Final structure:"
        ls -la templates/
        ls -la static/

    # ================================
    # STEP 12B: COMMIT BUILT FILES
    # ================================
    - name: 💾 Commit built frontend files
      run: |
        echo "Configuring git..."
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        echo "Adding built files to git..."
        git add -f templates/ static/

        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          echo "Committing built frontend files..."
          git commit -m "Auto-build: Update frontend build files

Built from commit ${{ github.sha }}"

          echo "Pushing changes..."
          git push
        fi
    
    # ================================
    # STEP 13: PREPARE DEPLOYMENT PACKAGE
    # ================================
    - name: 📦 Create deployment package
      run: |
        echo "Creating deployment package..."
        
        # Instead of creating a subfolder, modify files in place for Azure deployment
        # Azure's Oryx will build from the repository root, so files need to be there
        # Debug: Check if run.py exists
        echo "🔍 Checking if run.py exists:"
        ls -la run.py || echo "❌ run.py not found!"

        # Ensure run.py is in root (it should be already)
        echo "📄 Verifying run.py is in repository root for Azure deployment..."
        ls -la run.py && echo "✅ run.py found in root"

        # Clean up test files and cache from repository for deployment
        echo "🧹 Cleaning up test files and cache..."
        rm -rf backend/tests/
        rm -rf backend/__pycache__/
        rm -rf backend/.pytest_cache/
        rm -rf backend/htmlcov/
        rm -f backend/.coverage
        rm -f backend/coverage.xml 
        
        echo "📋 Repository ready for deployment:"
        echo "📄 Key files in repository root:"
        ls -la run.py requirements.txt 2>/dev/null || echo "Some files missing"
        echo "📂 Backend directory:"
        ls -la backend/ | head -5
        echo "📂 Templates and static directories:"
        ls -la templates/ static/ 2>/dev/null || echo "Frontend build folders ready"
        
        echo "✅ Repository prepared for Azure deployment"

    
    # ================================
    # STEP 14: DEPLOY TO AZURE (MAIN BRANCH ONLY)
    # ================================
    - name: 🔐 Azure Login
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    

    - name: 📦 Create atomic deployment zip
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "Creating deployment zip to prevent race conditions..."

        # Copy requirements.txt to root for Oryx
        echo "📄 Copying requirements.txt to root for Oryx build..."
        cp backend/requirements.txt requirements.txt
        echo "✅ requirements.txt copied to root"
        
        # Verify requirements.txt exists before zipping
        echo "🔍 Verifying requirements.txt exists in root..."
        ls -la requirements.txt && echo "✅ requirements.txt confirmed in root"
        
        # Create zip with all necessary files, explicitly include requirements.txt
        zip -r deployment.zip . \
          -i "run.py" \
          -i "requirements.txt" \
          -i "backend/*" \
          -i "templates/*" \
          -i "static/*" \
          -i "web.config" \
          -x "frontend/node_modules/*" \
          -x "frontend/build/*" \
          -x "backend/__pycache__/*" \
          -x "backend/.pytest_cache/*" \
          -x "backend/tests/*" \
          -x ".git/*" \
          -x ".github/*" \
          -x "*.pyc" \
          -x "coverage.xml" \
          -x "bandit-report.json"
        
        echo "✅ Atomic deployment zip created: $(du -h deployment.zip | cut -f1)"       
        # Verify zip contents include requirements.txt
        echo "🔍 Verifying zip contents..."
        unzip -l deployment.zip | grep -E "(run\.py|requirements\.txt|backend/)" | head -10

    # ================================
    # STEP 14: CONTAINER DEPLOYMENT (BYPASS ORYX)
    # ================================
    - name: 🔧 Set up Docker Buildx
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/setup-buildx-action@v3

    - name: 🔑 Log in to Azure Container Registry
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: rginternalai.azurecr.io
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    - name: 🏗️ Build and push container image
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          rginternalai.azurecr.io/internalai:latest
          rginternalai.azurecr.io/internalai:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🚀 Deploy container to Azure App Service
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🚀 Deploying container to Azure App Service..."

        # Configure App Service to use container
        az webapp config container set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group rg-internalai-prod \
          --docker-custom-image-name rginternalai.azurecr.io/internalai:latest \
          --docker-registry-server-url https://rginternalai.azurecr.io

        # Set environment variables for database
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group rg-internalai-prod \
          --settings \
            DATABASE_URL="${{ secrets.DATABASE_CONNECTION_STRING }}" \
            FLASK_ENV=production

        echo "⏳ Waiting for container deployment..."
        sleep 60

        echo "🔄 Restarting app service..."
        az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group rg-internalai-prod

        echo "✅ Container deployment completed"



    # ================================
    # STEP 14.5: VERIFY DEPLOYMENT
    # ================================
    - name: 🔍 Verify deployment and check logs
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "⏳ Waiting for app service to restart..."
        sleep 45
        
        echo "🔍 Checking application logs for database initialization..."
        az webapp log tail --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group rg-internalai-prod --output table --timeout 30 || echo "No logs available yet"
        
        echo "🌐 App should be available at: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

    # ================================
    # STEP 15: DEPLOYMENT SUMMARY
    # ================================
    - name: 📊 Deployment Summary
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🌐 Your app should be available at: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        echo "📋 Deployment Details:"
        echo "   - Python Version: ${{ env.PYTHON_VERSION }}"
        echo "   - Node.js Version: ${{ env.NODE_VERSION }}"
        echo "   - Branch: ${{ github.ref }}"
        echo "   - Commit: ${{ github.sha }}"