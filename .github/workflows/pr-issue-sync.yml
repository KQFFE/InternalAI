name: Sync PR Body with Linked Issue

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  sync:
    permissions:
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    
    steps:
      - name: ✍️ Sync PR Body from Linked Issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Part 1: Get Linked Issue
            const prBody = context.payload.pull_request.body;
            console.log(`Searching for linked issue in PR body:\n---\n${prBody}\n---`);
            if (!prBody) {
              core.setFailed('PR body is empty. Cannot find linked issue.');
              return;
            }

            const regex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/i;
            const match = prBody.match(regex);

            if (!match) {
              core.setFailed('Could not find a linked issue in the PR body. Use keywords like "resolves #123".');
              return;
            }

            const issueNumber = match[1];
            console.log(`Found linked issue number: ${issueNumber}`);

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const issueBody = issue.data.body || '';
            console.log(`Parsing issue #${issueNumber} body:\n---\n${issueBody}\n---`);

            // Part 2: Construct and Update PR Body
            function getSection(body, title) {
              const regex = new RegExp(`###\s+${title}:?\s*\n([\s\S]*?)(?=\n###|\n---|\n\s*$)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : null;
            }

            const description = getSection(issueBody, 'Description');
            const acceptanceCriteria = getSection(issueBody, 'Acceptance Criteria');

            const finalDescription = description || issueBody;
            const finalAcceptanceCriteria = acceptanceCriteria || '*(No acceptance criteria found in issue)*';

            // --- PRESERVE EXISTING CONTENT ---
            const existingHowToTest = getSection(prBody, 'How to Test');
            const existingReadyChecklist = getSection(prBody, 'Definition of Ready Checklist');

            const preservedHowToTest = existingHowToTest || '*(Please provide clear, step-by-step instructions on how to test this PR.)*\n1. \n2. \n3. ';

            // Preserve checkbox state and ensure all default items are present
            const defaultChecklistItems = [
                '- [ ] Code is documented and commented where needed.',
                '- [ ] All new and existing tests pass.',
                '- [ ] A review has been requested from at least one other team member.',
                '- [ ] All code has been reviewed by the developer for logic and formatting.',
                '- [ ] All new code has been linted and is free of formatting errors.'
            ];
            
            const preservedReadyChecklist = defaultChecklistItems.map(defaultItem => {
                const existingItem = existingReadyChecklist && existingReadyChecklist.split('\n').find(line => line.trim().endsWith(defaultItem.substring(4)));
                return existingItem || defaultItem;
            }).join('\n');

            const template = [
              `### Linked Issue`,
              `Resolves #${issueNumber}`,
              ``,
              `### Description`,
              `${finalDescription}`,
              ``,
              `### Acceptance Criteria`,
              `${finalAcceptanceCriteria}`,
              ``,
              `---`,
              ``,
              `### Definition of Ready Checklist`,
              `${preservedReadyChecklist}`,
              ``,
              `### How to Test`,
              `${preservedHowToTest}`
            ].join('\n');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: template
            });