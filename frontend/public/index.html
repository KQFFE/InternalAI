<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description"
          content="InternalAI - Building the future with AI-powered development. A full-stack React and Flask application showcasing modern web development." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Google Fonts - Inter for beautiful typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>InternalAI - Building the Future with AI</title>
    <script>
      // This script is for manual testing of the dynamic cookie banner feature.
      // It injects a mock CookieInformation object if the URL contains ?test_dynamic_cookies=true.
      // This feature is also covered by automated E2E tests in cookie_banner_dynamic.spec.js.
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('test_dynamic_cookies') === 'true') {
        window.CookieInformation = {
          getConsent: () => ({
            cookies: [
              { type: 'necessary', service: 'Test Service', purpose: 'To test dynamic loading.', privacyPolicy: '#', expiry: 'Session', name: 'test_cookie_1', provider: 'Test Provider' },
              { type: 'functional', service: 'Another Service', purpose: 'Another test.', privacyPolicy: '#', expiry: '1 year', name: 'test_cookie_2', provider: 'Another Provider' },
            ]
          }),
          getCookieCategories: () => Promise.resolve([
            { name: 'necessary', label: 'Nödvändiga (Dynamisk)', description: 'Dynamiskt laddade nödvändiga cookies.', isMutable: false },
            { name: 'functional', label: 'Funktionella (Dynamisk)', description: 'Dynamiskt laddade funktionella cookies.', isMutable: true },
          ])
        };
      }
    </script>
</head>
<body>
